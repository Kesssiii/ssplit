openapi: 3.0.3
info:
  title: ssplit API
  version: 1.0.0
  description: |
    OpenAPI specification for the ssplit Flask application.

servers:
  - url: http://localhost:5000
    description: Local development server

security:
  - bearerAuth: []

paths:
  /api/health:
    get:
      summary: API health check
      operationId: healthCheck
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok

  /api/auth/register:
    post:
      summary: Register a new user
      operationId: registerUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: User created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Email already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/auth/login:
    post:
      summary: Log in and create a session
      operationId: loginUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          description: Missing credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Invalid email or password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/auth/logout:
    post:
      summary: Log out the current user
      operationId: logoutUser
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Logged out successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Logged out
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/auth/me:
    get:
      summary: Get current logged-in user
      operationId: getCurrentUser
      security:
        - bearerAuth: []
      responses:
        "200":
          description: User returned successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: "#/components/schemas/User"
        "401":
          description: Invalid or expired token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/users:
    get:
      summary: List all users
      operationId: listUsers
      security:
        - bearerAuth: []
      responses:
        "200":
          description: User list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/scheduled-bills:
    get:
      summary: List scheduled bills for the current user
      operationId: listScheduledBills
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Scheduled bills returned
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ScheduledBill"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      summary: Create a scheduled bill
      operationId: createScheduledBill
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScheduledBillCreateRequest"
      responses:
        "200":
          description: Scheduled bill created
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                    example: 1
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/scheduled-bills/{scheduled_bill_id}:
    delete:
      summary: Delete a scheduled bill
      operationId: deleteScheduledBill
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: scheduled_bill_id
          required: true
          schema:
            type: integer
          description: ID of the scheduled bill to delete
      responses:
        "200":
          description: Scheduled bill deleted
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/bills:
    get:
      summary: List bills
      operationId: listBills
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Bills returned
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Bill"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      summary: Create a bill
      operationId: createBill
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BillCreateRequest"
      responses:
        "200":
          description: Bill created
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                    example: 1
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/bills/{bill_id}:
    delete:
      summary: Delete a bill
      operationId: deleteBill
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: bill_id
          required: true
          schema:
            type: integer
          description: ID of the bill to delete
      responses:
        "200":
          description: Bill deleted
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/expenses/overview:
    get:
      summary: Get expense overview
      operationId: getExpenseOverview
      security:
        - bearerAuth: []
      responses:
        "501":
          description: Feature not implemented yet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
          example: A bearer token is required

    User:
      type: object
      properties:
        id:
          type: integer
          example: 1
        email:
          type: string
          format: email
          example: user@example.com

    UserResponse:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/User"

    RegisterRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: user@example.com
        password:
          type: string
          format: password
          minLength: 8
          example: secret123

    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: user@example.com
        password:
          type: string
          format: password
          example: secret123

    LoginResponse:
      type: object
      properties:
        token:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        expires_at:
          type: string
          format: date-time
          example: "2026-09-27T12:00:00+00:00"
        user:
          $ref: "#/components/schemas/User"

    Bill:
      type: object
      properties:
        id:
          type: integer
          example: 1
        description:
          type: string
          example: Rent
        amount:
          type: string
          example: "145.00"
        paid_by:
          type: integer
          nullable: true
          example: 1
        due_date:
          type: string
          nullable: true
          example: "2026-09-30"

    BillCreateRequest:
      type: object
      required:
        - description
        - amount
        - paid_by
        - split_between
      properties:
        description:
          type: string
          example: Rent
        amount:
          type: string
          example: "145.00"
        paid_by:
          type: integer
          example: 1
        split_between:
          type: string
          example: "1,2,3"
        due_date:
          type: string
          nullable: true
          example: "2026-09-30"

    ScheduledBill:
      type: object
      properties:
        id:
          type: integer
          example: 1
        description:
          type: string
          example: Groceries
        amount:
          type: string
          example: "75.00"
        due_date:
          type: string
          example: "2026-09-15"
        frequency:
          type: string
          example: monthly

    ScheduledBillCreateRequest:
      type: object
      required:
        - description
        - amount
        - frequency
      properties:
        description:
          type: string
          example: Groceries
        amount:
          type: string
          example: "75.00"
        due_date:
          type: string
          nullable: true
          example: "2026-09-15"
        frequency:
          type: string
          example: monthly
